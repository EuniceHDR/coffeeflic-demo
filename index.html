<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoffeefliC 2.0 | Coffee, your way</title><meta name="description" content="CoffeefliC 2.0: standalone interactive coffee ordering demo.">
<style>
:root{font:15px Inter,system-ui,-apple-system,sans-serif;color:#30241e;background:#e9e1d6}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d9a66b;outline-offset:2px}
.shell{width:min(100%,428px);min-height:100dvh;margin:auto;background:#f8f4ed;position:relative;box-shadow:0 8px 45px #35221c22}.content{padding:26px 26px 112px;min-height:100dvh}.brand{display:flex;align-items:center;justify-content:space-between;margin:10px 0 35px}.logotype{font-size:27px;font-weight:850;letter-spacing:-1.1px;color:#5b3829}.logo-icon{color:#b76f29;margin-right:6px}.avatar{border-radius:100%;background:#eee2d3;padding:11px;color:#5b3829}
.tiny{font-size:10px;letter-spacing:.03em;font-weight:800}.muted{color:#8c7a70}.small{font-size:12px}.heading{font-weight:850;font-size:29px;letter-spacing:-.7px;line-height:1.15;margin:3px 0 24px}h2{font-size:20px;margin:28px 0 15px;letter-spacing:-.4px}h3{font-size:15px;margin:8px 0}p{line-height:1.5}.search{background:white;padding:17px;border-radius:15px;border:0;width:100%;color:#30241e}.promo{margin:20px 0 28px;background:#5b3829;border-radius:24px;color:#fff;padding:24px 20px}.promo small{color:#d9a66b;font-weight:800}.promo b{font-size:28px;display:block;margin:5px 0}.promo p{margin:0 0 11px;color:#f2e0d1;font-size:13px}.pillrow{display:flex;gap:8px;margin-bottom:22px}.pill{border-radius:25px;background:white;color:#30241e;padding:11px 15px;flex:1;font-weight:650;font-size:12px}.pill.on,.choose button.on{background:#5b3829;color:white}.promo .pill{background:#d9a66b;color:#30241e;flex:initial;padding:8px 16px}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.textbtn{background:none;color:#5b3829;font-weight:750;font-size:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border-radius:19px;background:white;padding:9px;text-align:left;color:#30241e;min-width:0}.card h3{font-size:12px;line-height:1.25}.price{color:#5b3829;font-size:12px;font-weight:850}.photo{height:110px;border-radius:15px;background:#eee2d3;display:grid;place-items:center;overflow:hidden;position:relative}.photo.big{height:280px;border-radius:22px;margin:15px 0 20px}.cup{position:relative;width:58px;height:83px;background:linear-gradient(100deg,#7e452b,#eac6a2 35%,#fff0d9 65%,#b27448);clip-path:polygon(7% 0,93% 0,81% 100%,20% 100%);border-radius:10px 10px 15px 15px;box-shadow:inset 10px 0 #ffffff44;filter:drop-shadow(0 5px 2px #59402c33)}.cup:before{content:"";position:absolute;top:0;left:0;width:100%;height:13px;background:#a45d37}.big .cup{transform:scale(2.6)}.rowcard{background:white;padding:12px;border-radius:16px;margin:10px 0;display:flex;gap:12px;align-items:center;text-align:left;width:100%;color:inherit}.rowcard .photo{width:74px;height:78px;flex:0 0 74px}.rowcard .cup{transform:scale(.7)}.grow{flex:1;min-width:0}.rowcard h3{margin:0 0 4px}.back{display:flex;align-items:center;gap:25px;background:none;color:#30241e;padding:14px 0 18px;font-size:18px;font-weight:800}.back span{font-size:24px}.choiceTitle{margin-top:26px}.choose{display:flex;gap:9px}.choose button{flex:1;background:white;border-radius:13px;padding:18px 7px;font-size:12px;font-weight:750;color:#30241e}.field{display:block;font-weight:800;margin:25px 0}.field select,.field input{width:100%;margin-top:12px;padding:18px 15px;border:0;border-radius:13px;background:white;color:#30241e}.primary{width:100%;border-radius:15px;background:#5b3829;color:white;font-weight:850;padding:19px 14px;margin:16px 0}.secondary{width:100%;border-radius:14px;background:#eee2d3;color:#5b3829;font-weight:800;padding:16px;margin:8px 0}.note{padding:15px;background:#eee2d3;border-radius:12px;color:#785f54;font-size:12px;line-height:1.5;margin:20px 0}.summary{margin-top:23px}.summary .between{margin:14px 0}.total{padding-top:14px;border-top:1px solid #e0d6cb;font-size:17px;font-weight:800}.qty{display:flex;align-items:center;gap:12px}.qty button{border-radius:50%;width:27px;height:27px;background:#eee2d3;color:#5b3829}.status{background:#5b3829;color:#fff;border-radius:17px;padding:22px;margin-top:18px}.step{display:flex;gap:12px;padding:15px 4px;border-bottom:1px solid #eee2d3;align-items:center}.dot{width:17px;height:17px;border:3px solid #d8c8b6;border-radius:50%}.dot.done{background:#5b3829;border-color:#5b3829}.tag{color:#367151;font-weight:800;font-size:10px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,428px);background:white;display:flex;padding:10px 0 max(13px,env(safe-area-inset-bottom));box-shadow:0 -4px 18px #432a2010}.bottom button{flex:1;background:white;color:#99867b;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.bottom button.on{color:#5b3829;font-weight:850}.bottom .ico{font-size:23px}.empty{padding:28px 12px;text-align:center;background:white;border-radius:18px;margin:16px 0}.fav{background:none;color:#5b3829;font-size:26px}.link{color:#5b3829;text-decoration:none;font-weight:750}
@media(min-width:700px){.shell{margin:30px auto;border-radius:24px;overflow:hidden;min-height:850px}.content{min-height:850px}.bottom{position:sticky;transform:none;width:100%;margin-top:-84px}}
</style></head>
<body><main class="shell"><section id="app" class="content"></section><nav class="bottom" id="nav" aria-label="Main navigation"></nav></main>
<script>
const sizes=['Small','Medium','Large'],products=[
{id:'caramel',name:'Iced Caramel Macchiato',cat:'Iced',desc:'Bold espresso, chilled milk and silky caramel in every sip.',prices:[89,159,189]},
{id:'espresso',name:'Iced Espresso',cat:'Iced',desc:'Bold and refreshing espresso over ice.',prices:[89,159,189]},
{id:'cappuccino',name:'Iced Cappuccino',cat:'Iced',desc:'Iced espresso topped with a light creamy milk foam.',prices:[89,159,189]},
{id:'latte',name:'Iced Latte',cat:'Iced',desc:'Smooth espresso blended with creamy chilled milk.',prices:[89,159,189]},
{id:'mocha',name:'Iced Mocha',cat:'Iced',desc:'Espresso, cool milk and rich chocolate flavor.',prices:[89,159,189]},
{id:'americano',name:'Iced Americano',cat:'Iced',desc:'Rich espresso lightened with cool water.',prices:[89,159,189]},
{id:'hotespresso',name:'Hot Espresso',cat:'Hot',desc:'Freshly brewed espresso with a bold rich aroma.',prices:[89,159,189]},
{id:'hotcap',name:'Hot Cappuccino',cat:'Hot',desc:'Warm espresso, silky steamed milk and airy foam.',prices:[89,159,189]},
{id:'hotamericano',name:'Hot Americano',cat:'Hot',desc:'Fresh espresso with hot water for a smooth classic.',prices:[89,159,189]},
{id:'honey',name:'Americano Honey Lime',cat:'Signature',desc:'Chilled americano brightened with honey and lime.',prices:[89,159,189]},
{id:'orange',name:'Americano Orange Juice',cat:'Signature',desc:'Refreshing espresso and orange juice combination.',prices:[89,159,189]}];
const base={page:'home',filter:'All',search:'',selected:'caramel',size:0,milk:'Oat milk',cart:[],saved:[],method:'Pickup',address:'Home',payment:'Cash',order:null,status:0};
let s={...base};try{const v=JSON.parse(localStorage.getItem('coffeeflic-live'));if(v)s={...s,...v,page:'home'}}catch(e){}
const $=x=>document.querySelector(x),money=n=>'₱'+n,photo=(large=false)=>'<div class="photo'+(large?' big':'')+'"><div class="cup"></div></div>',get=id=>products.find(p=>p.id===id)||products[0];
function persist(){try{localStorage.setItem('coffeeflic-live',JSON.stringify(s))}catch(e){}}function go(page){s.page=page;persist();render();window.scrollTo(0,0)}function choose(id){s.selected=id;s.size=0;s.milk='Oat milk';go('detail')}function head(name){return '<button class="back" onclick="go(\'home\')"><span>←</span>'+name+'</button>'}
function pill(category){s.filter=category;go('home')}function card(p){return '<button class="card" onclick="choose(\''+p.id+'\')">'+photo()+'<h3>'+p.name+'</h3><b class="price">From '+money(p.prices[0])+' &nbsp; +</b></button>'}
function list(p){return '<button class="rowcard" onclick="choose(\''+p.id+'\')">'+photo()+'<div class="grow"><h3>'+p.name+'</h3><div class="small muted">'+p.desc+'</div><b class="price">From '+money(p.prices[0])+'</b></div><b>›</b></button>'}
function home(){let visible=products.filter(p=>s.filter==='All'||p.cat===s.filter);return '<div class="brand"><span class="logotype"><span class="logo-icon">☕</span>coffeefliC</span><button class="avatar" onclick="go(\'profile\')">☺</button></div><div class="tiny">YOUR COFFEE, YOUR WAY</div><h1 class="heading">Your daily dose<br>of happiness ☕</h1><button class="search muted" style="text-align:left" onclick="go(\'search\')">⌕ &nbsp; Search your favorite coffee</button><div class="promo"><small>COFFEEFLIC FAVORITE</small><b>TODAY\'S PICK</b><p>Your next coffee break starts here.</p><button class="pill" onclick="choose(\'caramel\')">Order now →</button></div><h2>What are you craving?</h2><div class="pillrow">'+['All','Iced','Hot','Signature'].map(x=>'<button class="pill '+(s.filter===x?'on':'')+'" onclick="pill(\''+x+'\')">'+x+'</button>').join('')+'</div><div class="between"><h2>Popular right now</h2><button class="textbtn" onclick="go(\'explore\')">See all →</button></div><div class="cards">'+visible.slice(0,6).map(card).join('')+'</div>'}
function explore(){return head('Explore coffee')+'<p class="muted small">Discover your next favorite drink</p><h2>Browse categories</h2>'+['Iced','Hot','Signature'].map(x=>'<button class="rowcard between" onclick="pill(\''+x+'\')"><b>'+x+' coffee</b><b>→</b></button>').join('')+'<h2>Full menu</h2><div class="cards">'+products.map(card).join('')+'</div>'}
function search(){return head('Find your coffee')+'<p class="muted small">Browse coffee by type or popular searches</p><input class="search" id="searchField" placeholder="Search your favorite coffee" value="'+safe(s.search)+'" oninput="s.search=this.value;persist();searchList()"><h2>Recommended drinks</h2><div id="searchList">'+products.filter(p=>p.name.toLowerCase().includes(s.search.toLowerCase())).map(list).join('')+'</div>'}
function searchList(){$('#searchList').innerHTML=products.filter(p=>p.name.toLowerCase().includes(s.search.toLowerCase())).map(list).join('')||'<p>No matching drinks</p>'}
function safe(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggle(id){s.saved=s.saved.includes(id)?s.saved.filter(x=>x!==id):[...s.saved,id];persist();render()}
function detail(){let p=get(s.selected);return head('Your coffee')+photo(true)+'<div class="small" style="color:#bd8b4b;font-weight:800">★ 4.9 · Demo favorite</div><div class="between"><h2 style="margin:14px 0">'+p.name+'</h2><button class="fav" aria-label="Save favorite" onclick="toggle(\''+p.id+'\')">'+(s.saved.includes(p.id)?'♥':'♡')+'</button></div><p class="small muted">'+p.desc+'</p><h2 class="choiceTitle">Choose your size</h2><div class="choose">'+sizes.map((x,i)=>'<button class="'+(s.size===i?'on':'')+'" onclick="s.size='+i+';persist();render()">'+x+' '+money(p.prices[i])+'</button>').join('')+'</div><label class="field">Make it yours<select onchange="s.milk=this.value;persist()">'+['Oat milk','Regular milk'].map(x=>'<option '+(s.milk===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><button class="primary" onclick="add()">Add to Cart · '+money(p.prices[s.size])+'</button>'}
function add(){let key=[s.selected,s.size,s.milk].join('-');let c=s.cart.find(c=>c.key===key);if(c)c.qty++;else s.cart.push({key,id:s.selected,size:s.size,milk:s.milk,qty:1});go('cart')}
function saved(){return head('Saved coffees')+'<p class="muted small">Your favorite drinks in one place</p>'+(s.saved.length?s.saved.map(id=>list(get(id))).join(''):'<div class="empty"><h2>Coffee you love ♡</h2><p>Save your go-to drinks by tapping the heart on any product.</p></div>')+'<h2>Suggested favorites</h2>'+list(get('caramel'))+list(get('espresso'))}
function line(c){return get(c.id).prices[c.size]*c.qty}function subtotal(){return s.cart.reduce((a,c)=>a+line(c),0)}function fee(){return s.method==='Delivery'?35:0}function summary(){return '<div class="summary"><h3>Order summary</h3><div class="between"><span class="muted">Coffee subtotal</span><b>'+money(subtotal())+'</b></div><div class="between"><span class="muted">Service fee</span><b>'+money(fee())+'</b></div><div class="between total"><span>Total</span><span>'+money(subtotal()+fee())+'</span></div></div>'}
function qty(key,n){let c=s.cart.find(c=>c.key===key);if(!c)return;c.qty+=n;if(c.qty<1)s.cart=s.cart.filter(x=>x!==c);persist();render()}
function cart(){if(!s.cart.length)return head('Your cart')+'<div class="empty"><h2>Your cart is empty</h2><p>Discover your next favorite coffee.</p><button class="primary" onclick="go(\'explore\')">Explore coffee</button></div>';return head('Your cart')+'<p class="muted small">'+s.cart.reduce((a,c)=>a+c.qty,0)+' drinks in your cart</p><button class="rowcard between" onclick="go(\'address\')"><span><b>'+(s.method==='Pickup'?'Pickup at the café':'Deliver to '+s.address)+'</b><p class="small muted">Choose pickup or a demo delivery address</p></span><b>→</b></button>'+s.cart.map(c=>{let p=get(c.id);return '<div class="rowcard">'+photo()+'<div class="grow"><h3>'+p.name+'</h3><p class="small muted">'+sizes[c.size]+' · '+c.milk+'</p><div class="between"><b class="price">'+money(p.prices[c.size])+' each</b><div class="qty"><button aria-label="Decrease quantity" onclick="qty(\''+c.key+'\',-1)">−</button>'+c.qty+'<button aria-label="Increase quantity" onclick="qty(\''+c.key+'\',1)">+</button></div></div></div></div>'}).join('')+'<button class="secondary" onclick="go(\'explore\')">+ Add another drink</button><h2>How would you like it?</h2><div class="choose">'+['Pickup','Delivery'].map(x=>'<button class="'+(s.method===x?'on':'')+'" onclick="s.method=\''+x+'\';persist();render()">'+x+'</button>').join('')+'</div>'+summary()+'<button class="primary" onclick="go(\'payment\')">Continue to payment · '+money(subtotal()+fee())+'</button>'}
function address(){return head('Delivery address')+'<h2>Fast, easy doorstep delivery</h2><p class="muted small">Select an illustrative address</p>'+['Home','Office'].map(x=>'<button class="rowcard between" onclick="s.address=\''+x+'\';s.method=\'Delivery\';persist();render()"><span><b>'+x+'</b><p class="small muted">Example address · Philippines</p></span><b>'+(s.address===x?'✓':'→')+'</b></button>').join('')+'<div class="note">These are demo addresses. No personal delivery details are stored or sent to a server.</div><button class="primary" onclick="s.method=\'Delivery\';go(\'cart\')">Use this address</button>'}
function payment(){return head('Payment')+'<h2>Choose payment method</h2><p class="muted small">Demonstration only. No payment is charged.</p><div class="choose" style="flex-wrap:wrap">'+['Cash','Card','GCash','Maya'].map(x=>'<button style="flex:1 0 40%" class="'+(s.payment===x?'on':'')+'" onclick="s.payment=\''+x+'\';persist();render()">'+x+'</button>').join('')+'</div>'+summary()+'<div class="note">Payment choices are illustrative and do not connect to a bank or payment gateway.</div><button class="primary" onclick="checkout()">Place demo order · '+money(subtotal()+fee())+'</button>'}
function checkout(){if(!s.cart.length)return go('cart');s.order={id:'CF-'+Math.floor(1000+Math.random()*9000),method:s.method,payment:s.payment,total:subtotal()+fee()};s.cart=[];s.status=0;go('confirmed')}
function confirmed(){return head('Order confirmed')+'<div class="empty"><div style="font-size:78px;color:#5b3829">✓</div><h1>Order confirmed!</h1><p class="muted">Your coffee is being prepared with love.</p><p class="small">Payment method: <b>'+(s.order?.payment||'Cash')+'</b></p><div class="note">ORDER #'+(s.order?.id||'CF-DEMO')+'</div></div><button class="primary" onclick="go(\'tracking\')">Track my order →</button><button class="secondary" onclick="go(\'home\')">Back to home</button>'}
function tracking(){let steps=s.order?.method==='Delivery'?['Order received','Preparing','Out for delivery','Delivered']:['Order received','Preparing','Ready for pickup','Completed'];return head('Track your order')+'<div class="status"><h2 style="margin:0">'+(s.status===0?'We have your order!':s.status===1?'Your coffee is brewing':s.status===2?steps[2]:'Order complete!')+'</h2><p class="small">Preview of simulated order status</p></div><h2>Order progress</h2>'+steps.map((x,i)=>'<div class="step"><span class="dot '+(i<=s.status?'done':'')+'"></span><b class="grow">'+x+'</b>'+(i===s.status?'<span class="tag">CURRENT</span>':'')+'</div>').join('')+'<button class="secondary" onclick="s.status=(s.status+1)%4;persist();render()">Preview next status →</button><div class="note">Order tracking is a local demonstration. No actual order or courier exists.</div><button class="primary" onclick="go(\'home\')">Back to home</button>'}
function profile(){return head('My account')+'<div class="empty"><h2>☺ Coffee lover</h2><p class="muted">Guest · Demo account</p></div>'+[['Track order','tracking'],['Delivery address','address'],['Browse menu','explore'],['View cart','cart']].map(([name,page])=>'<button class="rowcard between" onclick="go(\''+page+'\')"><b>'+name+'</b><b>→</b></button>').join('')}
function render(){let views={home,explore,search,detail,saved,cart,address,payment,confirmed,tracking,profile};$('#app').innerHTML=(views[s.page]||home)();let active=['detail','search','address','payment','confirmed','tracking'].includes(s.page)?'':s.page;$('#nav').innerHTML=[['home','⌂','Home'],['explore','◈','Explore'],['saved','♡','Saved'],['cart','▣','Cart']].map(([p,ico,label])=>'<button class="'+(active===p?'on':'')+'" onclick="go(\''+p+'\')"><span class="ico">'+ico+'</span>'+label+'</button>').join('')}render();
</script></body></html>
